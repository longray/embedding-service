[project]
name = "qwen3-embedding-service"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    # === Web 服务 ===
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.9.0,<2.10.0",
    "python-multipart>=0.0.9,<0.0.10",
    
    # === 模型推理（ModelScope 方式）===
    "modelscope>=1.17.0,<1.18.0",
    "transformers>=4.48.0",  # ⬅️ 升级以支持 Qwen3
    # torch 2.4.0+cu121 单独安装，不写在这里
    
    # === ModelScope 兼容依赖（关键！）===
    "datasets>=2.14.0,<2.15.0",      # ⬅️ 降级：避免 get_metadata_patterns 错误
    "oss2>=2.19.1,<2.20.0",          # ModelScope 需要
    "aiohttp>=3.8.0,<3.10.0",        # ⬅️ 降低版本，兼容 modelscope 1.17
    
    # === 工具库 ===
    "numpy>=1.26.0,<1.27.0",
    "sentencepiece>=0.2.0,<0.3.0",  # Qwen 模型需要
    "regex>=2023.0.0",
    "psutil>=6.0.0,<6.1.0",
    "tqdm>=4.65.0,<5.0.0",
    "packaging>=23.0,<24.0",
    "addict>=2.4.0,<2.5.0",
    "filelock>=3.12.0,<3.14.0",
    "sympy>=1.12.0,<1.14.0",         # ⬅️ 降低上限，兼容 modelscope
    "setuptools>=68.0.0,<70.0.0",

    # === SurrealDB ===
    "surrealdb>=1.0.0,<2.0.0",

    # === Meilisearch (全文搜索) ===
    "httpx>=0.26.0,<1.0.0",            # Meilisearch REST API 客户端（复用项目已有依赖）
    
    # === 缓存 (Phase A-B3) ===
    "aiocache>=0.12.0",                # 异步缓存支持
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.40.0,<2.0.0",
    "opentelemetry-sdk>=1.40.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-instrumentation-httpx>=0.61b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40.0,<2.0.0",
]
[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

# === QUALITY-SPEC-REF ===
# Repo: longray/code-quality-standard
# Files: docs/11-TOOLCHAIN-TEMPLATES.md#python-project-template
#        docs/03-LINTING-STANDARDS.md#3.2
#        docs/06-TESTING-STANDARDS.md#6.2
# === /QUALITY-SPEC-REF ===

[tool.ruff]
target-version = "py310"
line-length = 120
include = ["src/**/*.py"]
exclude = ["tests/", ".venv/", "venv/", "build/", "dist/", "src/**/models/", "scripts/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
    "S",   # flake8-bandit (安全规则)
]

ignore = [
    "E501",   # line too long (由line-length配置处理)
    "W293",   # blank line contains whitespace
    "RUF001", # 忽略中文标点符号检查
    "RUF002", # 忽略docstring中的中文标点符号
    "RUF003", # 忽略注释中的中文标点符号
    "E501",   # line too long (由line-length配置处理)
    "W293",   # blank line contains whitespace
    "S608",   # SQL注入警告（SDK限制必须使用字面量，已通过 _sanitize_query 清洗）
    "S324",   # MD5哈希（用于缓存键，非安全场景）
    "S104",   # 绑定到所有接口（服务设计需要）
]
[tool.pytest.ini_options]
 testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: pure logic or mock tests, no real service required",
    "integration: tests with partial mocking (e.g. MemoryManager with mocked HTTP)",
    "e2e: tests calling real services via HTTP (localhost)",
    "slow: marks tests as slow",
]
[tool.coverage.run]
 source = ["src", "wrapper/src"]
branch = true
omit = ["*/tests/*", "*/__init__.py", "*/scripts/*"]
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
fail_under = 70
show_missing = true
skip_covered = true
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "build", "dist", "src/qwen3_embedding_service/models", "scripts"]
skips = ["B101"]  # Skip assert_used test (pytest uses assert)
severity = "low"

[tool.pyright]
exclude = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist",
    "src/**/models",
    "scripts",
    "src/**/start_*.py",
    "wrapper/src/utils/memory_manager"
]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
lint-md = "uvx pre-commit run markdownlint-cli2 --all-files"
lint-md-stats = "uv run python scripts/assess_md040.py"
