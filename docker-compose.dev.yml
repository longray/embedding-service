version: '3.8'

services:
  # SurrealDB 开发数据库，使用本地路径数据卷以便热重载开发数据
  surrealdb:
    image: surrealdb/surrealdb:v3.0.1
    container_name: embedding-surrealdb-dev
    ports:
      - "18002:18002"
    command: start --user root --pass root --bind 0.0.0.0:18002 rocksdb://data
    volumes:
      - surrealdb-data-dev:/data
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch 全文搜索引擎（开发环境）
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: embedding-meilisearch-dev
    ports:
      - "18003:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey_change_in_production}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-data-dev:/meili_data
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Embedding 服务（本地代码挂载，热重载）
  embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    container_name: embedding-service-dev
    ports:
      - "18000:18000"
    environment:
      - EMB_PORT=18000
      - EMB_MODEL_PATH=/app/src/qwen3_embedding_service/models/Qwen/Qwen3-Embedding-0___6B
    volumes:
      - ./src/qwen3_embedding_service:/app/src/qwen3_embedding_service
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LLM 服务（暂时禁用）
  # llm:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.llm
  #   container_name: llm-service-dev
  #   ports:
  #     - "18001:18001"
  #   environment:
  #     - LLM_PORT=18001
  #     - LLM_MODEL_PATH=OpenBMB/MiniCPM4-0.5B
  #   volumes:
  #     - ./src/qwen3_embedding_service:/workspace/src/qwen3_embedding_service
  #     - ./models:/models
  #   networks:
  #     - embedding-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:18001/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # 包装层服务：使用多阶段构建开发目标，本地代码挂载实现热重载
  wrapper:
    build:
      context: ./wrapper
      dockerfile: Dockerfile.multistage
      target: development
    container_name: wrapper-service-dev
    ports:
      - "18008:18008"
      - "17999:17999"
    environment:
      - WRAPPER_PORT=18008
      - WRAPPER_LEGACY_PORT=17999
      - WRAPPER_ENABLE_DUAL_PORT=true
      - WRAPPER_EMBEDDING_SERVICE_URL=http://embedding:18000
      - WRAPPER_LLM_SERVICE_URL=http://llm:18001
      - WRAPPER_SURREALDB_URL=ws://surrealdb:18002/rpc
      - WRAPPER_SURREALDB_NAMESPACE=memory_ns
      - WRAPPER_SURREALDB_DATABASE=memory_db
      - WRAPPER_SURREALDB_USERNAME=root
      - WRAPPER_SURREALDB_PASSWORD=root
      - WRAPPER_SURREALDB_RUNTIME_USERNAME=runtime_user
      - WRAPPER_SURREALDB_RUNTIME_PASSWORD=change_me_in_production
      - WRAPPER_SURREALDB_USE_RUNTIME_CREDENTIALS=true
      - WRAPPER_MEILI_URL=http://meilisearch:7700
      - WRAPPER_MEILI_API_KEY=${MEILI_MASTER_KEY:-masterKey_change_in_production}
      - WRAPPER_MEILI_INDEX_NAME=memories
      - WRAPPER_DEBUG=true
    volumes:
      # 热重载：本地代码修改立即反映到容器内
      - ./wrapper/src:/app/wrapper/src
    depends_on:
      surrealdb:
        condition: service_healthy
      embedding:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18008/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  surrealdb-data-dev:
  meili-data-dev:

networks:
  embedding-network:
    driver: bridge
