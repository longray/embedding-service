version: '3.8'

services:
  # SurrealDB 开发数据库，使用本地路径数据卷以便热重载开发数据
  surrealdb:
    image: surrealdb/surrealdb:v3.0.1
    container_name: embedding-surrealdb-dev
    ports:
      - "8000:8000"
    command: start --user root --pass root --bind 0.0.0.0:8000 rocksdb://data
    volumes:
      - surrealdb-data-dev:/data
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Embedding 服务（本地代码挂载，热重载）
  embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    container_name: embedding-service-dev
    ports:
      - "18000:18000"
    environment:
      - EMB_PORT=18000
      - EMB_MODEL_PATH=/models/Qwen3-Embedding-0___6B
    volumes:
      - ./src/qwen3_embedding_service:/workspace/src/qwen3_embedding_service
      - ./models:/models
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LLM 服务（本地代码挂载，热重载）
  llm:
    build:
      context: .
      dockerfile: Dockerfile.llm
    container_name: llm-service-dev
    ports:
      - "18001:18001"
    environment:
      - LLM_PORT=18001
      - LLM_MODEL_PATH=/models/OpenBMB/MiniCPM4-0.5B
    volumes:
      - ./src/qwen3_embedding_service:/workspace/src/qwen3_embedding_service
      - ./models:/models
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 包装层服务：依赖同一网络，使用本地代码目录以便热重载
  wrapper:
    build:
      context: ./wrapper-service
      dockerfile: Dockerfile
    container_name: wrapper-service-dev
    ports:
      - "3001:3001"
    environment:
      - WRAPPER_PORT=3001
      - WRAPPER_EMBEDDING_SERVICE_URL=http://embedding-service-dev:18000
      - WRAPPER_LLM_SERVICE_URL=http://llm-service-dev:18001
      - WRAPPER_SURREALDB_URL=ws://surrealdb:8000/rpc
      - WRAPPER_SURREALDB_NAMESPACE=memory_ns
      - WRAPPER_SURREALDB_DATABASE=memory_db
      - WRAPPER_SURREALDB_USERNAME=root
      - WRAPPER_SURREALDB_PASSWORD=root
    volumes:
      - ./wrapper-service:/workspace/wrapper-service
      - ./src/qwen3_embedding_service:/workspace/src/qwen3_embedding_service
      - ./models:/models
    depends_on:
      surrealdb:
        condition: service_healthy
      embedding:
        condition: service_healthy
      llm:
        condition: service_healthy
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  surrealdb-data-dev:
  model-cache-dev:

networks:
  embedding-network:
    driver: bridge
