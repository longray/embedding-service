# === QUALITY-SPEC-REF ===
# Repo: longray/code-quality-standard
# File: docs/11-TOOLCHAIN-TEMPLATES.md
# Section: #python-project-template
# File: docs/07-PRECOMMIT-STANDARDS.md
# Section: #7.2
# Priority: P0-P2 (安全扫描P0, 类型检查P1, 格式化P2)
# === /QUALITY-SPEC-REF ===

default_stages: [pre-commit]
fail_fast: false

exclude: '^\\.venv/|^dist/|^build/|^\\.ruff_cache/'

repos:
  # ===========================================
  # 🔐 安全扫描（P0 优先级）
  # ===========================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Detection

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: Bandit Python Security Check
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']

  # ===========================================
  # 🐍 Python 后端检查（P1-P2 优先级）
  # ===========================================
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format (Python)
        entry: uv run ruff format src/
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: ruff-check
        name: Ruff Check (Python)
        entry: uv run ruff check src/ --fix
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: pyright
        name: Pyright Type Check
        entry: uv run pyright src/
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: Pytest (Python)
        entry: uv run pytest src/tests/ -v --tb=short
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
        require_serial: true
