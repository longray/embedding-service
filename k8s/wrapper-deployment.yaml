apiVersion: apps/v1
kind: Deployment
metadata:
  name: wrapper
  namespace: opencode-memory
  labels:
    app: wrapper
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wrapper
  template:
    metadata:
      labels:
        app: wrapper
    spec:
      containers:
        - name: wrapper
          image: opencode-memory/wrapper:v3.2.0
          ports:
            - containerPort: 18008
              name: http
            - containerPort: 18000
              name: embedding
          env:
            - name: SURREAL_URL
              value: "ws://surrealdb:8000/rpc"
            - name: SURREAL_NS
              value: "memory_ns"
            - name: SURREAL_DB
              value: "memory_db"
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: wrapper-secret
                  key: surreal-user
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: wrapper-secret
                  key: surreal-pass
            - name: WRAPPER_MEILI_ENABLED
              value: "true"
            - name: WRAPPER_MEILI_URL
              value: "http://meilisearch:7700"
            - name: WRAPPER_MEILI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wrapper-secret
                  key: meili-api-key
            - name: WRAPPER_PORT
              value: "18008"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 18008
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 18008
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wrapper
  namespace: opencode-memory
  labels:
    app: wrapper
spec:
  selector:
    app: wrapper
  ports:
    - port: 18008
      targetPort: 18008
      name: http
    - port: 18000
      targetPort: 18000
      name: embedding
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: wrapper-secret
  namespace: opencode-memory
type: Opaque
stringData:
  surreal-user: "runtime_user"
  surreal-pass: "runtime_pass"
  meili-api-key: "masterKey_change_in_production"
