# ============================================================
# Certbot SSL Configuration for Embedding Service
# Automatic SSL certificate renewal with Let's Encrypt
# ============================================================

version: '3.8'

services:
  # Certbot for SSL certificate management
  certbot:
    image: certbot/certbot:latest
    container_name: embedding-certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - embedding-network
    profiles:
      - ssl  # Only start with: docker compose --profile ssl up

  # Nginx reverse proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: embedding-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - certbot-data:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - wrapper
    networks:
      - embedding-network
    profiles:
      - ssl
    restart: unless-stopped

  # Wrapper service (existing configuration)
  wrapper:
    extends:
      file: docker-compose.yml
      service: wrapper
    networks:
      - embedding-network
    # Expose only to internal network, not external ports
    # Nginx will proxy to this service

volumes:
  certbot-data:
  certbot-www:

networks:
  embedding-network:
    external: true  # Use the network from main docker-compose.yml
