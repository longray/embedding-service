[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: tests with partial mocking (e.g. MemoryManager with mocked HTTP)
    unit: pure logic or mock tests, no real service required
    e2e: tests calling real services via HTTP (localhost)
