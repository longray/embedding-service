version: '3.8'

services:
  # SurrealDB 向量数据库（自定义镜像，支持健康检查）
  surrealdb:
    build:
      context: .
      dockerfile: Dockerfile.surrealdb
    container_name: embedding-surrealdb
    ports:
      - "18002:18002"
    command: start --user root --pass root --bind 0.0.0.0:18002 rocksdb://data
    volumes:
      - ./docker-data/surrealdb:/data
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "/bin/httpcheck", "http://localhost:18002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Meilisearch 全文搜索引擎
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: embedding-meilisearch
    ports:
      - "18003:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey_change_in_production}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./docker-data/meilisearch:/meili_data
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Embedding 服务（GPU 加速）
  embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding.gpu
    container_name: embedding-service
    ports:
      - "18000:18000"
    environment:
      - EMB_PORT=18000
      - EMB_MODEL_PATH=/app/src/qwen3_embedding_service/models/Qwen/Qwen3-Embedding-0___6B
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./src/qwen3_embedding_service:/app/src/qwen3_embedding_service
    networks:
      - embedding-network
    # GPU 配置
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 包装层服务
  wrapper:
    build:
      context: .
      dockerfile: wrapper/Dockerfile.multistage
      target: production
    container_name: wrapper-service
    ports:
      - "18008:18008"  # v3.2: 新默认端口
      - "17999:17999"  # v3.2: 旧端口（并行期支持）
    environment:
      - WRAPPER_PORT=18008
      - WRAPPER_LEGACY_PORT=17999
      - WRAPPER_ENABLE_DUAL_PORT=true
      - WRAPPER_EMBEDDING_SERVICE_URL=http://embedding:18000
      - WRAPPER_SURREALDB_URL=ws://surrealdb:18002/rpc
      - WRAPPER_SURREALDB_NAMESPACE=memory_ns
      - WRAPPER_SURREALDB_DATABASE=memory_db
      - WRAPPER_SURREALDB_USERNAME=root
      - WRAPPER_SURREALDB_PASSWORD=root
      - WRAPPER_MEILI_URL=http://meilisearch:7700
      - WRAPPER_MEILI_API_KEY=${MEILI_MASTER_KEY:-masterKey_change_in_production}
      - WRAPPER_MEILI_INDEX_NAME=memories
    volumes:
      - ./scripts:/app/scripts
    depends_on:
      surrealdb:
        condition: service_healthy
      embedding:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18008/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

networks:
  embedding-network:
    driver: bridge
