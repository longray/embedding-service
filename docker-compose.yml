version: '3.8'

services:
  # SurrealDB 向量数据库
  surrealdb:
    image: surrealdb/surrealdb:v3.0.1
    container_name: embedding-surrealdb
    ports:
      - "18002:18002"
    command: start --user root --pass root --bind 0.0.0.0:18002 rocksdb://data
    volumes:
      - surrealdb-data:/data
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch 全文搜索引擎（Polyglot 架构：关键词搜索 + 中文分词 + 日期精确匹配）
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: embedding-meilisearch
    ports:
      - "18003:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey_change_in_production}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-data:/meili_data
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Embedding 服务
  embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    container_name: embedding-service
    ports:
      - "18000:18000"
    environment:
      - EMB_PORT=18000
      - EMB_MODEL_PATH=Qwen/Qwen3-Embedding-0___6B
    volumes:
      - model-cache:/models
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LLM 服务
  llm:
    build:
      context: .
      dockerfile: Dockerfile.llm
    container_name: llm-service
    ports:
      - "18001:18001"
    environment:
      - LLM_PORT=18001
      - LLM_MODEL_PATH=OpenBMB/MiniCPM4-0.5B
    volumes:
      - model-cache:/models
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 包装层服务
  wrapper:
    build:
      context: ./wrapper
      dockerfile: Dockerfile.multistage
      target: production
    container_name: wrapper-service
    ports:
      - "18008:18008"  # v3.2: 新默认端口
      - "17999:17999"  # v3.2: 旧端口（并行期支持）
    environment:
      - WRAPPER_PORT=18008
      - WRAPPER_LEGACY_PORT=17999
      - WRAPPER_ENABLE_DUAL_PORT=true
      - WRAPPER_EMBEDDING_SERVICE_URL=http://embedding:18000
      - WRAPPER_LLM_SERVICE_URL=http://llm:18001
      - WRAPPER_SURREALDB_URL=ws://surrealdb:18002/rpc
      - WRAPPER_OTEL_ENABLED=${WRAPPER_OTEL_ENABLED:-false}
      - WRAPPER_OTEL_ENDPOINT=http://jaeger:4317
      - WRAPPER_SURREALDB_NAMESPACE=memory_ns
      - WRAPPER_SURREALDB_DATABASE=memory_db
      - WRAPPER_SURREALDB_USERNAME=root
      - WRAPPER_SURREALDB_PASSWORD=root
      - WRAPPER_SURREALDB_RUNTIME_USERNAME=runtime_user
      - WRAPPER_SURREALDB_RUNTIME_PASSWORD=change_me_in_production
      - WRAPPER_SURREALDB_USE_RUNTIME_CREDENTIALS=true
      - WRAPPER_MEILI_URL=http://meilisearch:7700
      - WRAPPER_MEILI_API_KEY=${MEILI_MASTER_KEY:-masterKey_change_in_production}
      - WRAPPER_MEILI_INDEX_NAME=memories
    depends_on:
      surrealdb:
        condition: service_healthy
      embedding:
        condition: service_healthy
      llm:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18008/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Jaeger 分布式追踪（可选，OpenTelemetry 后端）
  jaeger:
    image: jaegertracing/jaeger:2.6
    container_name: embedding-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC 接收端
      - "4318:4318"     # OTLP HTTP 接收端
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - embedding-network
    profiles:
      - tracing  # 仅 docker compose --profile tracing up 时启动

volumes:
  surrealdb-data:
  model-cache:
  meili-data:

networks:
  embedding-network:
    driver: bridge
