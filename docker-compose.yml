version: '3.8'

services:
  # SurrealDB 向量数据库
  surrealdb:
    image: surrealdb/surrealdb:v3.0.1
    container_name: embedding-surrealdb
    ports:
      - "8000:8000"
    command: start --user root --pass root --bind 0.0.0.0:8000 rocksdb://data
    volumes:
      - surrealdb-data:/data
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Embedding 服务
  embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    container_name: embedding-service
    ports:
      - "18000:18000"
    environment:
      - EMB_PORT=18000
      - EMB_MODEL_PATH=Qwen/Qwen3-Embedding-0___6B
    volumes:
      - model-cache:/models
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LLM 服务
  llm:
    build:
      context: .
      dockerfile: Dockerfile.llm
    container_name: llm-service
    ports:
      - "18001:18001"
    environment:
      - LLM_PORT=18001
      - LLM_MODEL_PATH=OpenBMB/MiniCPM4-0.5B
    volumes:
      - model-cache:/models
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 包装层服务
  wrapper:
    build:
      context: ./wrapper-service
      dockerfile: Dockerfile
    container_name: wrapper-service
    ports:
      - "3001:3001"
    environment:
      - WRAPPER_PORT=3001
      - WRAPPER_EMBEDDING_SERVICE_URL=http://embedding:18000
      - WRAPPER_LLM_SERVICE_URL=http://llm:18001
      - WRAPPER_SURREALDB_URL=ws://surrealdb:8000/rpc
      - WRAPPER_OTEL_ENABLED=${WRAPPER_OTEL_ENABLED:-false}
      - WRAPPER_OTEL_ENDPOINT=http://jaeger:4317
      - WRAPPER_SURREALDB_NAMESPACE=memory_ns
      - WRAPPER_SURREALDB_DATABASE=memory_db
      - WRAPPER_SURREALDB_USERNAME=root
      - WRAPPER_SURREALDB_PASSWORD=root
    depends_on:
      surrealdb:
        condition: service_healthy
      embedding:
        condition: service_healthy
      llm:
        condition: service_healthy
    networks:
      - embedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Jaeger 分布式追踪（可选，OpenTelemetry 后端）
  jaeger:
    image: jaegertracing/jaeger:2.6
    container_name: embedding-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC 接收端
      - "4318:4318"     # OTLP HTTP 接收端
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - embedding-network
    profiles:
      - tracing  # 仅 docker compose --profile tracing up 时启动

volumes:
  surrealdb-data:
  model-cache:

networks:
  embedding-network:
    driver: bridge
